# Shared cargo-deny baseline for InstruktAI repos.
#
# deps-audit.yml uses this file only when the caller ships no deny.toml of
# its own. The security knowledge lives in the RustSec advisory database that
# cargo-deny reads; this file only decides how findings are treated.
# Reference: https://embarkstudios.github.io/cargo-deny/checks/cfg.html

[advisories]
version = 2
# Vulnerability advisories always fail in config version 2.
yanked = "deny"
# Unmaintained advisories match every crate here; deps-audit.yml downgrades
# them to warnings with `-W unmaintained` while this default is in use.
unmaintained = "all"
ignore = []

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

# Licenses are only checked when the caller sets `cargo-deny-licenses: true`.
# This permissive baseline is a starting point; repos with other needs ship
# their own deny.toml.
[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8
