name: deploy-cloudflare

on:
  workflow_call:
    inputs:
      project-name:
        type: string
        required: true
      node-version:
        type: string
        default: '22'
      build-command:
        type: string
        default: 'run build'
      dist:
        type: string
        default: 'dist'
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Build
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm ${{ inputs.build-command }}; else npm ${{ inputs.build-command }}; fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ inputs.dist }} --project-name=${{ inputs.project-name }}
