name: ci-python

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: '3.12'
      run-e2e:
        type: boolean
        default: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: make install

      - name: Lint and test
        run: make lint test

      - name: E2E gate
        if: ${{ inputs.run-e2e }}
        run: |
          if grep -qE '^e2e:' Makefile 2>/dev/null; then
            make e2e
          else
            echo "no e2e target — skipping"
          fi
