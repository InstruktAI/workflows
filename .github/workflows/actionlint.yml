name: actionlint

# Lints every workflow in this repository (syntax, `uses` and input
# references, expressions, and shellcheck over `run:` steps), so a broken
# reusable workflow cannot reach main unnoticed. The binary is pinned by
# version and verified against its release checksum before it runs.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint (checksum-verified)
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" actionlint
      - name: Lint workflows
        run: ./actionlint -color
      # Consumers pin this repo; that pin only holds all the way down when
      # every action this repo calls is itself a full commit SHA with its
      # version as a comment. The values come from parsed YAML (yq ships on
      # the hosted ubuntu image), so flow mappings count and a comment can
      # never satisfy the check.
      - name: Every third-party action is pinned to a commit SHA
        run: |
          set -euo pipefail
          yq --version
          python3 -I scripts/check-pins.py .github/workflows/*.yml
          python3 -I scripts/check-pins.py test/fixtures/pin-check/good/*.yml
          for bad in test/fixtures/pin-check/bad/*.yml; do
            if python3 -I scripts/check-pins.py "$bad" > /dev/null; then
              echo "::error::check-pins accepted $bad"
              exit 1
            fi
          done
