name: actionlint

# Lints every workflow in this repository (syntax, `uses` and input
# references, expressions, and shellcheck over `run:` steps), so a broken
# reusable workflow cannot reach main unnoticed. The binary is pinned by
# version and verified against its release checksum before it runs.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint (checksum-verified)
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" actionlint
      - name: Lint workflows
        run: ./actionlint -color
      # Consumers pin this repo; that pin only holds all the way down when
      # every action this repo calls is itself a full commit SHA with its
      # version as a comment.
      - name: Every third-party action is pinned to a commit SHA
        run: |
          unpinned=$(grep -rnE '^\s*-?\s*uses:\s' .github/workflows \
            | grep -vE 'uses:\s*\./' \
            | grep -vE 'uses:\s*[^@[:space:]]+@[0-9a-f]{40}\s+#\s*\S' || true)
          if [ -n "$unpinned" ]; then
            echo "::error::actions not pinned to a full commit SHA with a version comment:"
            echo "$unpinned"
            exit 1
          fi
