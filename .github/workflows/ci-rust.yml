name: ci-rust

on:
  workflow_call:
    inputs:
      run-e2e:
        type: boolean
        default: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable @ 2026-10-16
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Lint and test
        run: make lint test

      - name: E2E gate
        if: ${{ inputs.run-e2e }}
        run: |
          if grep -qE '^e2e:' Makefile 2>/dev/null; then
            make e2e
          else
            echo "no e2e target — skipping"
          fi
