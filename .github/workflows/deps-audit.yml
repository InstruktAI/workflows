name: deps-audit

# Dependency safety gates. Every check is a maintained third-party tool reading
# its own advisory database; this workflow only detects ecosystems and wires
# the tools up. Ecosystems are detected in the caller's `working-directory`.

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory holding the project manifests, relative to the repo root
        type: string
        default: '.'
      dependency-review:
        description: "GitHub dependency review on pull_request: auto (public repos only, private repos need GitHub Advanced Security), always, never"
        type: string
        default: auto
      fail-on-severity:
        description: "Lowest advisory severity that fails dependency review: low, moderate, high, critical"
        type: string
        default: low
      osv-scanner:
        description: Full lockfile scan against osv.dev (vulnerabilities and MAL- malicious-package advisories); on pull_request also an informational diff report
        type: boolean
        default: true
      cargo-deny:
        description: Run cargo-deny (advisories, bans, sources) when Cargo.toml exists
        type: boolean
        default: true
      cargo-deny-licenses:
        description: Also run the cargo-deny licenses check
        type: boolean
        default: false
      msrv:
        description: Check the workspace builds on the rust-version declared in Cargo.toml
        type: boolean
        default: true
      pip-audit:
        description: Run pip-audit over uv.lock when pyproject.toml exists
        type: boolean
        default: true
      node-audit:
        description: Run npm audit or pnpm audit when package.json exists
        type: boolean
        default: true
      node-audit-level:
        description: "Lowest severity that fails npm/pnpm audit: low, moderate, high, critical"
        type: string
        default: low
      node-version:
        description: Node.js version used for npm/pnpm audit
        type: string
        default: '24'
    outputs:
      cargo:
        description: "'true' when Cargo.toml was found"
        value: ${{ jobs.detect.outputs.cargo }}
      msrv:
        description: Distinct rust-versions declared by the Cargo workspace members, space-separated and sorted; empty when none
        value: ${{ jobs.detect.outputs.msrv }}
      msrv-matrix:
        description: "JSON list of {rust-version, args}: the cargo check package selection run on each declared rust-version"
        value: ${{ jobs.detect.outputs.msrv-matrix }}
      python:
        description: "'uv' when pyproject.toml and uv.lock were found"
        value: ${{ jobs.detect.outputs.python }}
      node:
        description: "'npm' or 'pnpm' when package.json and its lockfile were found"
        value: ${{ jobs.detect.outputs.node }}

permissions:
  contents: read

jobs:
  detect:
    name: detect ecosystems
    runs-on: ubuntu-latest
    outputs:
      cargo: ${{ steps.detect.outputs.cargo }}
      msrv: ${{ steps.detect.outputs.msrv }}
      msrv-matrix: ${{ steps.detect.outputs.msrv-matrix }}
      python: ${{ steps.detect.outputs.python }}
      node: ${{ steps.detect.outputs.node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: detect
        name: Detect ecosystems
        working-directory: ${{ inputs.working-directory }}
        run: |
          cargo=false msrv='' msrv_matrix='[]' python='' node=''
          if [ -f Cargo.toml ]; then
            cargo=true
            # Cargo resolves every member's rust-version, inherited or quoted
            # any way. `+stable` so a rust-toolchain.toml is not needed yet.
            # One cargo check per distinct rust-version: the whole workspace
            # when every member declares the same one, else just the members
            # that declare it.
            msrv_matrix=$(cargo +stable metadata --format-version 1 --no-deps --manifest-path Cargo.toml | jq -c '
              (.packages | length) as $total
              | [.packages[] | select(.rust_version != null) | {v: .rust_version, n: .name}]
              | group_by(.v) as $groups
              | $groups | map({
                  "rust-version": .[0].v,
                  args: (if ($groups | length) == 1 and length == $total
                         then "--workspace"
                         else (map("-p " + .n) | join(" ")) end)
                })')
            msrv=$(jq -r 'map(.["rust-version"]) | join(" ")' <<< "$msrv_matrix")
          fi
          if [ -f pyproject.toml ]; then
            # pip-audit audits the locked set; an unlocked project fails closed.
            if [ -f uv.lock ]; then python=uv; else python=unlocked; fi
          fi
          if [ -f package.json ]; then
            if [ -f pnpm-lock.yaml ]; then node=pnpm
            elif [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then node=npm
            else node=unlocked
            fi
          fi
          {
            echo "cargo=$cargo"
            echo "msrv=$msrv"
            echo "msrv-matrix=$msrv_matrix"
            echo "python=$python"
            echo "node=$node"
          } >> "$GITHUB_OUTPUT"
          echo "cargo=$cargo msrv=${msrv:-none} python=${python:-none} node=${node:-none}"

  dependency-review:
    name: dependency review
    if: >-
      github.event_name == 'pull_request' && (
        inputs.dependency-review == 'always' ||
        (inputs.dependency-review == 'auto' && github.event.repository.private == false)
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: ${{ inputs.fail-on-severity }}

  osv-scanner:
    name: osv-scanner
    if: inputs.osv-scanner
    runs-on: ubuntu-latest
    env:
      SCAN_DIR: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          persist-credentials: false

      # pull_request, informational only: the findings this PR introduces,
      # mirroring google/osv-scanner-action's osv-scanner-reusable-pr.yml
      # without its SARIF upload (which would need security-events: write).
      # It never gates: a finding already on the base is still a finding.
      - name: Check out the base commit
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # A directory the base lacks is scanned as empty.
        run: |
          git checkout --quiet "$BASE_SHA"
          mkdir -p "$SCAN_DIR"

      - name: Scan the base commit (informational)
        if: github.event_name == 'pull_request'
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=old-results.json
            --allow-no-lockfiles
            --recursive
            ${{ inputs.working-directory }}

      - name: Check out the pull request
        if: github.event_name == 'pull_request'
        run: git checkout --quiet --force "$GITHUB_SHA"

      - name: Scan the pull request (informational)
        if: github.event_name == 'pull_request'
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=new-results.json
            --recursive
            ${{ inputs.working-directory }}

      - name: Report findings the pull request introduces (informational)
        if: github.event_name == 'pull_request'
        uses: google/osv-scanner-action/osv-reporter-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        continue-on-error: true
        with:
          scan-args: |-
            --output=osv-results.sarif
            --old=old-results.json
            --new=new-results.json
            --gh-annotations=true
            --fail-on-vuln=false

      # The gate, on every event: a full scan of every lockfile in the checked
      # out head. Any finding fails, whether or not this change introduced it.
      - name: Scan all lockfiles
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --recursive
            ${{ inputs.working-directory }}

  cargo-deny:
    name: cargo-deny
    needs: detect
    if: needs.detect.outputs.cargo == 'true' && inputs.cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: config
        name: Resolve cargo-deny config
        env:
          PROJECT_DIR: ${{ inputs.working-directory }}
          LICENSES: ${{ inputs.cargo-deny-licenses }}
          # The repo and commit this reusable workflow was loaded from, so the
          # shared default always matches the workflow version the caller pinned.
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          checks='advisories bans sources'
          if [ "$LICENSES" = true ]; then checks="$checks licenses"; fi
          found=''
          for candidate in "$PROJECT_DIR/deny.toml" "$PROJECT_DIR/.deny.toml" deny.toml .deny.toml; do
            if [ -f "$candidate" ]; then found=$candidate; break; fi
          done
          if [ -n "$found" ]; then
            echo "Using the caller's $found"
            config=$found lints=''
          else
            if [ -z "$WORKFLOW_REPOSITORY" ] || [ -z "$WORKFLOW_SHA" ]; then
              echo "::error::job.workflow_repository/job.workflow_sha unavailable; cannot fetch the shared deny/default.toml"
              exit 1
            fi
            mkdir -p .deps-audit
            curl --fail --silent --show-error --location --retry 3 \
              --output .deps-audit/deny.toml \
              "https://raw.githubusercontent.com/$WORKFLOW_REPOSITORY/$WORKFLOW_SHA/deny/default.toml"
            echo "Using the shared default from $WORKFLOW_REPOSITORY@$WORKFLOW_SHA"
            config=.deps-audit/deny.toml lints='--warn unmaintained'
          fi
          {
            echo "config=$config"
            echo "args=$lints $checks"
          } >> "$GITHUB_OUTPUT"

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: ${{ inputs.working-directory }}/Cargo.toml
          # --config is a cargo-deny global flag; lints and checks belong to `check`.
          arguments: --all-features --config ${{ steps.config.outputs.config }}
          command: check
          command-arguments: ${{ steps.config.outputs.args }}

  msrv:
    name: msrv ${{ matrix.rust-version }}
    needs: detect
    if: needs.detect.outputs.msrv != '' && inputs.msrv
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.msrv-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: ${{ matrix.rust-version }}

      - name: cargo check on the declared rust-version
        working-directory: ${{ inputs.working-directory }}
        env:
          MSRV: ${{ matrix.rust-version }}
          PACKAGES: ${{ matrix.args }}
        # `+toolchain` wins over a rust-toolchain.toml in the repo.
        run: |
          read -ra packages <<< "$PACKAGES"
          cargo "+$MSRV" check "${packages[@]}" --all-targets --locked

  pip-audit:
    name: pip-audit
    needs: detect
    if: needs.detect.outputs.python != '' && inputs.pip-audit
    runs-on: ubuntu-latest
    steps:
      - name: Require a lockfile
        if: needs.detect.outputs.python == 'unlocked'
        run: |
          echo "::error::pyproject.toml without uv.lock: pip-audit audits the locked dependency set. Commit uv.lock, or set pip-audit: false."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Export the locked dependency set
        working-directory: ${{ inputs.working-directory }}
        # Every group and extra, without the project itself or local paths
        # (they are not on PyPI). Exact pins, so pip-audit needs no resolver.
        run: >-
          uv export --frozen --format requirements.txt
          --all-groups --all-extras
          --no-emit-workspace --no-emit-local --no-hashes
          --output-file "$RUNNER_TEMP/requirements.txt"

      # --strict: a dependency PyPI no longer serves (404, typical for removed
      # malicious packages) fails the audit instead of being skipped.
      - name: pip-audit
        run: >-
          uvx --from 'pip-audit==2.10.1' pip-audit
          --requirement "$RUNNER_TEMP/requirements.txt"
          --no-deps --disable-pip --strict --progress-spinner off

  node-audit:
    name: node audit
    needs: detect
    if: needs.detect.outputs.node != '' && inputs.node-audit
    runs-on: ubuntu-latest
    steps:
      - name: Require a lockfile
        if: needs.detect.outputs.node == 'unlocked'
        run: |
          echo "::error::package.json without package-lock.json or pnpm-lock.yaml: the audit reads the lockfile. Commit one, or set node-audit: false."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}

      # Both audits read the lockfile only; nothing is installed or executed.
      - name: npm audit
        if: needs.detect.outputs.node == 'npm'
        working-directory: ${{ inputs.working-directory }}
        env:
          AUDIT_LEVEL: ${{ inputs.node-audit-level }}
        run: npm audit --package-lock-only --audit-level="$AUDIT_LEVEL"

      - name: pnpm audit
        if: needs.detect.outputs.node == 'pnpm'
        working-directory: ${{ inputs.working-directory }}
        env:
          AUDIT_LEVEL: ${{ inputs.node-audit-level }}
        run: |
          corepack enable
          pnpm audit --audit-level "$AUDIT_LEVEL"
