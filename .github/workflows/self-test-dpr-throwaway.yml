name: self-test-dpr-throwaway

# Throwaway negative test, never merged: each pull request against this base
# changes one fixture dependency, and dep-pr-review must block it.

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/dep-pr-review.yml
    with:
      review-all-authors: true
      name: throwaway
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
